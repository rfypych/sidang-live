name: sidang-backtest

on:
  workflow_dispatch:
    inputs:
      months:
        description: "Kedalaman backtest (bulan)"
        default: "6"
      profile:
        description: "Profil hakim"
        default: "conservative"
        type: choice
        options: [conservative, balanced, aggressive]

permissions:
  contents: write

concurrency:
  group: sidang-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: walk-forward backtest
        run: python backtest.py --months ${{ github.event.inputs.months || '6' }} --profile ${{ github.event.inputs.profile || 'conservative' }}
      - name: commit laporan
        run: |
          git config user.name "sidang-bot"
          git config user.email "sidang-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "backtest: ${{ github.event.inputs.months || '6' }} bulan, ${{ github.event.inputs.profile || 'conservative' }}" && git push)

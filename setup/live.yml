name: sidang-live

on:
  schedule:
    - cron: "4,19,34,49 * * * *" # tiap 15 menit di MENIT SEPI — hindari puncak antrean Actions (:00/:15/:30/:45) tempat cron gratisan sering delay/drop; catch-up menoleransi delay/drop jadwal apa pun
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sidang-live
  cancel-in-progress: false # antre, jangan saling bunuh (record = append-only)

jobs:
  catchup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: sanitasi plumbing
        run: python tests/test_plumbing.py
      - name: catch-up paper loop (auto-beli uang virtual)
        run: python live_catchup.py
      - name: commit record
        run: |
          git config user.name "sidang-bot"
          git config user.email "sidang-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "tidak ada perubahan record"
          else
            git commit -m "live: $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push || (git pull --rebase --autostash && git push)
          fi

name: sidang-backtest

on:
  workflow_dispatch:
    inputs:
      months:
        description: "Kedalaman backtest (bulan)"
        default: "6"
      profile:
        description: "Profil hakim"
        default: "conservative"
        type: choice
        options: [conservative, balanced, aggressive]
      tag:
        description: "Suffix nama laporan (kosong = profil-tanggal)"
        default: ""
      max_minutes:
        description: "Batas wall-time kompute (menit)"
        default: "270"

permissions:
  contents: write

concurrency:
  group: sidang-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: reset marker laporan (run tak boleh selesai diam-diam)
        run: rm -f reports/backtest-latest.json
      - name: walk-forward backtest
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${{ github.event.inputs.profile || 'conservative' }}-$(date -u +%Y%m%d)"; fi
          python backtest.py \
            --months "${{ github.event.inputs.months || '6' }}" \
            --profile "${{ github.event.inputs.profile || 'conservative' }}" \
            --max-minutes "${{ github.event.inputs.max_minutes || '270' }}" \
            --tag "$TAG"
      - name: pastikan laporan final (bukan checkpoint)
        run: |
          test -f reports/backtest-latest.json || {
            echo "::error::backtest berhenti di checkpoint sebelum mengejar data terbaru (batas menit tercapai). Dispatch ulang dengan max_minutes lebih besar.";
            exit 1;
          }
      - name: commit laporan
        run: |
          git config user.name "sidang-bot"
          git config user.email "sidang-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "backtest: ${{ github.event.inputs.months || '6' }} bulan, ${{ github.event.inputs.profile || 'conservative' }}" && (git push || (git pull --rebase --autostash && git push)))
